    eqs.sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true})).forEach(([n,x])=>{
      h+=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:13px"><span style="flex:1;min-width:0">#${esc(n)} ${esc(x.desc)} <span class="note">${fmt(x.hrs)} h</span></span>
        <select class="ew-eq" data-n="${esc(n)}" style="${inp};width:190px;${x.cat===null?'border-color:var(--red)':''}"><option value="">${x.cat===null?'Pick a category':'(auto)'}</option>${EW_MACH.concat(['(ignore)']).map(c=>`<option${(st.eqMap||{})[n]===c||(!(st.eqMap||{})[n]&&x.cat===c)?' selected':''}>${esc(c)}</option>`).join('')}</select></div>`;});
  }
  h+=`<div style="margin-top:12px"><button class="btn" style="background:#2563eb;color:#fff;border-color:#2563eb" onclick="ewSave('${esc(job)}')"><i class="ti ti-device-floppy"></i> Save setup</button></div></div>`;
  return h;
}
async function ewSave(job){
  const num=id=>{const v=parseFloat(String(document.getElementById(id).value).replace(/[$,]/g,''));return isFinite(v)?v:0;};
  const cfg={name:document.getElementById('ew-name').value.trim(),bidCY:num('ew-bidCY'),bidCost:num('ew-bidCost'),bidSY:num('ew-bidSY'),bidCostFG:num('ew-bidCostFG'),rates:{}};
  document.querySelectorAll('.ew-rate').forEach(i=>{const v=parseFloat(String(i.value).replace(/[$,]/g,''));if(isFinite(v))cfg.rates[i.dataset.c]=v;});
  const eqm={};document.querySelectorAll('.ew-eq').forEach(s=>{if(s.value)eqm[s.dataset.n]=s.value;});
  const tok=await getToken(true);if(!tok)return;
  for(let a=0;a<3;a++){
    try{
      const H={Authorization:'Bearer '+tok};let etag=null,cur={rates:{},eqMap:{},jobs:{}};
      const mr=await fetch(ewUrl(),{headers:H});
      if(mr.status!==404){
        if(!mr.ok)throw new Error('read '+mr.status);
        etag=(await mr.json()).eTag;
        const cr=await fetch(ewUrl()+':/content',{headers:H});if(!cr.ok)throw new Error('read '+cr.status);
        const dd=await cr.json();if(!dd||typeof dd!=='object')throw new Error('setup file unreadable');cur=Object.assign(cur,dd);
      }
      cur.jobs=cur.jobs||{};cur.eqMap=Object.assign({},cur.eqMap||{},eqm);cur.jobs[job]=cfg;
      const PH={Authorization:'Bearer '+tok,'Content-Type':'application/json'};if(etag)PH['If-Match']=etag;
      const pr=await fetch(ewUrl()+':/content',{method:'PUT',headers:PH,body:JSON.stringify(cur)});
      if(pr.status===412)continue;
      if(!pr.ok)throw new Error('save '+pr.status);
      S.earth.setup=cur;S.eset=false;toast('Earthwork setup saved');render();return;
    }catch(e){toast('Save failed: '+e.message,'err');return;}
  }
  toast('Save failed: someone else was saving. Try again.','err');
}
// ===== WHAT'S-DONE PDF ======================================================
// Composites every saved daily plan markup (JobPlans/{job}/Marks/*.json from the
// timesheet app) onto the clean plan sheet -> one highlighted progress PDF.
const PG_SITE='valentiheld.sharepoint.com,155c9359-7fd3-4f2c-8c6a-b04a722b6f64,801969a1-b2a1-4f9a-8c3a-05ae5405e710';
const MK_ROOT='JobPlans';
const PG_COLORS={'300':'#8a5a2b','310':'#8a5a2b','400':'#ff8800','450':'#9333ea','500':'#1faa4b','600':'#1466d6'};
const PG_LABEL={'300':'Earthwork','310':'Fine Grade','400':'Storm','450':'Force Main','500':'Sanitary','600':'Watermain'};
let PG=null;
function tsUrl(p){return 'https://graph.microsoft.com/v1.0/sites/'+PG_SITE+'/drive/root:/'+p;}
async function openProgress(){
  const job=S.job;if(!job)return;
  toast('Loading plan markups…');
  const tok=await getToken(true);if(!tok)return;
  let plans=[],marks=[];
  try{
    const pr=await fetch(tsUrl(MK_ROOT+'/'+encodeURIComponent(job))+':/children?$top=200',{headers:{Authorization:'Bearer '+tok}});
    if(pr.status===404){toast('No plans uploaded for '+job+' yet (JobPlans/'+job+')','err');return;}
    if(!pr.ok)throw new Error('plans '+pr.status);
    plans=((await pr.json()).value||[]).filter(c=>c.file&&/\.pdf$/i.test(c.name||''));
    const mr=await fetch(tsUrl(MK_ROOT+'/'+encodeURIComponent(job)+'/Marks')+':/children?$top=999',{headers:{Authorization:'Bearer '+tok}});
    marks=mr.ok?((await mr.json()).value||[]).filter(c=>/\.json$/i.test(c.name||'')):[];
  }catch(e){toast('Could not load plans: '+e.message,'err');return;}
  if(!marks.length){toast('No saved markups for '+job+' yet — foremen save them from the timesheet app.','err');return;}
  const bySheet={};
  marks.forEach(m=>{const mm=m.name.match(/^(\d{4}-\d{2}-\d{2})__(.+)\.json$/i);if(!mm)return;
    (bySheet[mm[2]]=bySheet[mm[2]]||[]).push({date:mm[1],name:m.name});});
  const sheetBase=n=>n.replace(/\.pdf$/i,'').replace(/[^A-Za-z0-9_-]+/g,'_');
  const sheets=plans.map(p=>({pdf:p.name,base:sheetBase(p.name),marks:(bySheet[sheetBase(p.name)]||[]).sort((a,b)=>a.date<b.date?-1:1)})).filter(s=>s.marks.length);
  if(!sheets.length){toast('Markups exist but no matching plan PDFs — was a plan renamed?','err');return;}
  const dates=marks.map(m=>(m.name.match(/^(\d{4}-\d{2}-\d{2})/)||[])[1]).filter(Boolean).sort();
  PG={job,sheets,tok};
  const wrap=document.createElement('div');wrap.id='pg-modal';
  wrap.innerHTML=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)pgClose()">
    <div style="background:#171b22;border:1px solid #2a3140;border-radius:14px;padding:18px;max-width:440px;width:100%;color:inherit">
    <h3 style="font-weight:800;margin-bottom:4px"><i class="ti ti-highlight"></i> What's-done PDF — Job ${esc(job)}</h3>
    <p class="note" style="margin-bottom:10px">Overlays every saved daily markup onto the clean plan sheet.</p>
    ${sheets.map((s,i)=>`<label style="display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:13px;cursor:pointer"><input type="checkbox" id="pg-s${i}" checked> <span style="word-break:break-all">${esc(s.pdf)}</span> <span class="note" style="white-space:nowrap">${s.marks.length} day${s.marks.length>1?'s':''}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin:10px 0">
      <div style="flex:1"><div class="note">From</div><input type="date" id="pg-from" value="${dates[0]||''}" style="width:100%;padding:7px;border-radius:8px;border:1px solid #2a3140;background:transparent;color:inherit"></div>
      <div style="flex:1"><div class="note">Through</div><input type="date" id="pg-to" value="${dates[dates.length-1]||''}" style="width:100%;padding:7px;border-radius:8px;border:1px solid #2a3140;background:transparent;color:inherit"></div></div>
    <div id="pg-st" class="note" style="min-height:18px"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn" style="flex:1;justify-content:center" onclick="pgClose()">Cancel</button>
      <button class="btn" id="pg-go" style="flex:1;justify-content:center;background:#2563eb;color:#fff;border-color:#2563eb" onclick="pgGenerate()"><i class="ti ti-file-type-pdf"></i> Generate</button></div>
    </div></div>`;
  document.body.appendChild(wrap);
}
function pgClose(){const m=document.getElementById('pg-modal');if(m)m.remove();PG=null;}
async function pgEnsureWorker(){
  // A cross-origin workerSrc can't start a real Worker; fetch the script and serve it
  // same-origin as a blob so pdf.js gets a true worker instead of a fragile fallback.
  if(window.__pgWorkerReady)return;
  try{
    const js=await (await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')).text();
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));
  }catch(e){
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  window.__pgWorkerReady=1;
}
function pgRot(p,d){d=((d%360)+360)%360;let x=p[0],y=p[1];for(let i=0;i<d;i+=90){const nx=1-y,ny=x;x=nx;y=ny;}return [x,y];}
function pgArrow(ctx,x1,y1,x2,y2,sz,col){const a=Math.atan2(y2-y1,x2-x1);ctx.save();ctx.globalAlpha=.95;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-sz*Math.cos(a-.45),y2-sz*Math.sin(a-.45));ctx.lineTo(x2-sz*Math.cos(a+.45),y2-sz*Math.sin(a+.45));ctx.closePath();ctx.fill();ctx.restore();}
async function pgGenerate(){
  const go=document.getElementById('pg-go');if(go)go.disabled=true;
  const st=x=>{const e=document.getElementById('pg-st');if(e)e.textContent=x;};
  try{
    if(!window.pdfjsLib||!window.PDFLib){st('PDF tools still loading — try again in a second.');if(go)go.disabled=false;return;}
    await pgEnsureWorker();
    const from=document.getElementById('pg-from').value||'0000',to=document.getElementById('pg-to').value||'9999';
    const picked=PG.sheets.filter((s,i)=>{const c=document.getElementById('pg-s'+i);return c&&c.checked;});
    if(!picked.length){st('Pick at least one sheet.');if(go)go.disabled=false;return;}
    const {PDFDocument}=PDFLib;const out=await PDFDocument.create();
    const H={Authorization:'Bearer '+PG.tok};
    let pages=0;const usedDates=[];
    for(const s of picked){
      st('Loading marks for '+s.pdf+'…');
      const js=[];
      for(const m of s.marks){
        if(m.date<from||m.date>to)continue;
        const r=await fetch(tsUrl(MK_ROOT+'/'+encodeURIComponent(PG.job)+'/Marks/'+encodeURIComponent(m.name))+':/content',{headers:H});
        if(r.ok){const j=await r.json();j.__date=m.date;js.push(j);}
      }
      if(!js.length)continue;
      st('Rendering '+s.pdf+'…');
      const pb=await (await fetch(tsUrl(MK_ROOT+'/'+encodeURIComponent(PG.job)+'/'+encodeURIComponent(s.pdf))+':/content',{headers:H})).arrayBuffer();
      const doc=await pdfjsLib.getDocument({data:pb}).promise;
      const page=await doc.getPage(1);
      const rots={};js.forEach(j=>{const r0=(+j.userRot||0)%360;rots[r0]=(rots[r0]||0)+1;});
      const rRot=+Object.keys(rots).sort((a,b)=>rots[b]-rots[a])[0]||0;
      const vp0=page.getViewport({scale:1,rotation:(page.rotate+rRot)%360});
      const EXP=Math.min(3,Math.max(1.2,Math.sqrt(12e6/(vp0.width*vp0.height))));
      const vp=page.getViewport({scale:EXP,rotation:(page.rotate+rRot)%360});
      const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
      const cx=cv.getContext('2d');
      // intent:'print' schedules on timers, not requestAnimationFrame — display intent
      // suspends indefinitely when the tab loses focus, which reads as "stuck on Rendering".
      await Promise.race([
        page.render({canvasContext:cx,viewport:vp,intent:'print'}).promise,
        new Promise((_,rj)=>setTimeout(()=>rj(new Error('Rendering timed out on '+s.pdf+' — try again with this tab in the foreground.')),120000))
      ]);
      // Tracker-driven layer (drawn UNDER the foremen's ink): done/partial runs and
      // tied-in lots straight from TrackerStatus, using the one-time pinned geometry.
      let trkDone=0,trkPart=0;
      try{
        const gr=await fetch(tsUrl(MK_ROOT+'/'+encodeURIComponent(PG.job)+'/'+encodeURIComponent(s.base+'.geo.json'))+':/content',{headers:H});
        if(gr.ok){
          const geo=await gr.json();const pins=geo.pins||{};
          const gd=rRot-((+geo.userRot||0)%360);
          const P=k2=>{const p=pins[k2];return p?pgRot(p,gd):null;};
          S.scope.filter(r=>r.JobNum===PG.job).forEach(r=>{
            const pct=effPct(PG.job,r);
            if(r.ItemType==='lot'||r.ItemType==='lateral'){
              if(pct<100)return;
              const p=P('L:'+String(r.ItemID).trim());if(!p)return;
              cx.globalAlpha=.9;cx.fillStyle='#18b04b';
              cx.beginPath();cx.arc(p[0]*cv.width,p[1]*cv.height,5.5*EXP,0,Math.PI*2);cx.fill();
              cx.lineWidth=1.5*EXP;cx.strokeStyle='#fff';cx.stroke();trkDone++;
            }else{
              if(pct<=0)return;
              const ends=String(r.ItemID).split('-').map(x=>x.trim());
              if(ends.length!==2)return;
              const a=P('S:'+ends[0]),b=P('S:'+ends[1]);if(!a||!b)return;
              cx.globalAlpha=.45;cx.lineCap='round';
              cx.strokeStyle=pct>=100?'#18b04b':'#f5a623';cx.lineWidth=8*EXP;
              cx.beginPath();cx.moveTo(a[0]*cv.width,a[1]*cv.height);cx.lineTo(b[0]*cv.width,b[1]*cv.height);cx.stroke();
              if(pct>=100)trkDone++;else trkPart++;
            }
          });
          cx.globalAlpha=1;
        }
      }catch(e){console.warn('geo layer',e);}
      const phasesSeen={};
      js.forEach(j=>{usedDates.push(j.__date);
        const delta=rRot-((+j.userRot||0)%360);
        (j.strokes||[]).forEach(sk=>{
          const pts=(sk.pts||[]).map(p=>pgRot(p,delta));if(pts.length<2)return;
          phasesSeen[sk.phase||j.phase||'']=1;
          cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle=sk.color||'#c8102e';
          cx.globalAlpha=sk.kind==='line'?.85:.4;cx.lineWidth=(+sk.width||3)*EXP;
          cx.beginPath();pts.forEach((p,i)=>{const x=p[0]*cv.width,y=p[1]*cv.height;i?cx.lineTo(x,y):cx.moveTo(x,y);});cx.stroke();
          if(sk.kind==='line'){const n=pts.length;
            pgArrow(cx,pts[n-2][0]*cv.width,pts[n-2][1]*cv.height,pts[n-1][0]*cv.width,pts[n-1][1]*cv.height,Math.max(14,(+sk.width||3)*3)*EXP,sk.color||'#c8102e');}
        });});
      cx.globalAlpha=1;
      const lh=Math.round(20*EXP);cx.fillStyle='rgba(255,255,255,.9)';cx.fillRect(0,0,cv.width,lh);
      cx.fillStyle='#111';cx.textBaseline='middle';cx.font='700 '+Math.round(11*EXP)+'px Arial';
      let hx=8*EXP;const t1="Job "+PG.job+" — WHAT'S DONE through "+(to==='9999'?'today':to);
      cx.fillText(t1,hx,lh/2);hx+=cx.measureText(t1).width+14*EXP;
      cx.font='400 '+Math.round(10*EXP)+'px Arial';
      Object.keys(phasesSeen).sort().forEach(ph=>{
        cx.fillStyle=PG_COLORS[ph]||'#c8102e';cx.fillRect(hx,lh*0.32,14*EXP,lh*0.36);hx+=17*EXP;
        cx.fillStyle='#111';const lb=PG_LABEL[ph]||('Ph '+ph);cx.fillText(lb,hx,lh/2);hx+=cx.measureText(lb).width+12*EXP;});
      if(trkDone||trkPart){
        const leg=[['#18b04b','Done (tracker)']].concat(trkPart?[['#f5a623','In progress']]:[]);
        leg.forEach(L=>{cx.fillStyle=L[0];cx.fillRect(hx,lh*0.32,14*EXP,lh*0.36);hx+=17*EXP;cx.fillStyle='#111';cx.fillText(L[1],hx,lh/2);hx+=cx.measureText(L[1]).width+12*EXP;});
      }
      const img=await out.embedJpg(cv.toDataURL('image/jpeg',.85));
      const pg2=out.addPage([cv.width/EXP,cv.height/EXP]);
      pg2.drawImage(img,{x:0,y:0,width:cv.width/EXP,height:cv.height/EXP});
      pages++;if(doc.destroy)doc.destroy();
    }
    if(!pages){st('No markups in that date range.');if(go)go.disabled=false;return;}
    st('Writing PDF…');
    const bytes=await out.save();
    const blob=new Blob([bytes],{type:'application/pdf'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    usedDates.sort();
    a.download='VH_'+PG.job+'_whats-done_'+(usedDates[usedDates.length-1]||'')+'.pdf';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
    toast("What's-done PDF ready");pgClose();
  }catch(e){console.error('pg',e);st('Failed: '+e.message);if(go)go.disabled=false;}
}
initMsal().catch(e=>{document.getElementById('app').innerHTML=`<div class="empty">${esc(e.message)}</div>`;});
