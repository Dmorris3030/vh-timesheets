<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#185FA5">
<title>VH Job Trackers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --bg:#fafafa;--bg2:#f0f0f0;--border:#e5e5e5;--text:#111;--text2:#555;--text3:#888;
  --brand:#185FA5;--brand-d:#0C447C;--red:#c8102e;--green:#16a34a;--amber:#d97706;
  --card:#fff;--grid:rgba(24,95,165,.045);--shadow:0 1px 2px rgba(0,0,0,.04);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#101418;--bg2:#1a2027;--border:#2a323b;--text:#e8eaee;--text2:#9aa5b1;--text3:#69737f;
        --card:#171d24;--grid:rgba(130,180,230,.05);--shadow:0 1px 3px rgba(0,0,0,.5)}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed}
.num{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums}
/* Header */
.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:20}
.hdr-in{max-width:1050px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.3px;cursor:pointer}
.logo{width:30px;height:30px;background:var(--brand);color:#fff;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.container{max-width:1050px;margin:0 auto;padding:14px 16px 40px}
/* Buttons */
.btn{font:inherit;font-size:13px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-p:hover{background:var(--brand-d)}
.btn-sm{font-size:12px;padding:5px 10px}
.btn:disabled{opacity:.5;cursor:default}
/* KPI cards */
.kg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:560px){.kg{grid-template-columns:repeat(5,1fr)}}
.k{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--brand);border-radius:8px;padding:11px 12px;box-shadow:var(--shadow);min-width:0}
.k .lbl{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.k .val{font-family:'Barlow Condensed','Inter',sans-serif;font-size:26px;font-weight:600;line-height:1.05}
.k .sub{font-size:10px;color:var(--text3);margin-top:3px}
.val.good{color:var(--green)}.val.bad{color:var(--red)}
/* Sections */
.sec{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec h2{font-size:14px;font-weight:700;margin-bottom:10px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h2-sub{font-size:11px;color:var(--text3);font-weight:500}
/* Portfolio job cards */
.jcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:13px 14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);font:inherit;color:var(--text)}
.jcard:hover{border-color:var(--brand)}
.jtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.jname{font-weight:700;font-size:15px;letter-spacing:-.2px}
.jpct{font-family:'Barlow Condensed','Inter',sans-serif;font-size:22px;font-weight:600;color:var(--brand)}
.jmeta{display:flex;gap:14px;font-size:11.5px;color:var(--text2);flex-wrap:wrap;margin-bottom:8px}
.jmeta b{color:var(--text);font-weight:600}
.pbar{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}
.pbarfill{height:100%;background:var(--brand);transition:width .3s;border-radius:3px}
.pbarfill.done{background:var(--green)}
/* Phase filter chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* Phase summary strip */
.pstrip{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);padding:8px 10px;background:var(--bg2);border-radius:6px;margin-bottom:10px}
.pstrip b{font-family:'Barlow Condensed','Inter',sans-serif;font-size:15px;font-weight:600;color:var(--text)}
.pstrip .ov{color:var(--red)}.pstrip .un{color:var(--green)}
/* Area header */
.area-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin:14px 0 6px;display:flex;justify-content:space-between;gap:8px}
.area-h .ah-num{font-family:'Barlow Condensed','Inter',sans-serif;font-size:13px}
/* Run rows */
.run{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--bg2)}
.run:last-child{border-bottom:none}
.run-id{font-weight:700;font-size:13px;min-width:74px;letter-spacing:-.2px}
.run-desc{flex:1;min-width:0;font-size:11.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-bid{font-family:'Barlow Condensed','Inter',sans-serif;font-size:14px;font-weight:600;min-width:52px;text-align:right;color:var(--text2)}
.qbtn{font:inherit;font-size:11px;font-weight:600;color:var(--brand);background:none;border:none;border-bottom:1px dotted var(--brand);cursor:pointer;padding:2px 0;white-space:nowrap;flex-shrink:0}
.run-bid b{color:var(--text)}
/* Pct segmented control */
.pcts{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0}
.pcts button{font:inherit;font-size:11px;font-weight:600;padding:7px 0;width:34px;border:none;background:var(--card);color:var(--text3);cursor:pointer;border-right:1px solid var(--border)}
.pcts button:last-child{border-right:none}
.pcts button.on{background:var(--brand);color:#fff}
.pcts button.on.full{background:var(--green)}
@media(max-width:520px){.run-desc{display:none}.pcts button{width:33px;padding:9px 0}.run-id{min-width:64px;font-size:12px}.qbtn{font-size:10.5px}}
/* Lot chips (laterals) */
.lots{display:flex;gap:7px;flex-wrap:wrap}
.lot{font:inherit;font-size:12px;font-weight:700;min-width:46px;padding:9px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;text-align:center}
.lot.done{background:var(--green);border-color:var(--green);color:#fff}
/* Import */
.imp textarea{width:100%;height:150px;font:12px/1.5 'SF Mono',Menlo,Consolas,monospace;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);resize:vertical}
.frow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);min-width:110px}
.map-tbl{width:100%;font-size:12px;border-collapse:collapse;margin-top:8px}
.map-tbl th{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:6px;border-bottom:1px solid var(--border)}
.map-tbl td{padding:5px 6px;border-bottom:1px solid var(--bg2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.prog{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-top:10px}
.progfill{height:100%;background:var(--brand);transition:width .2s}
/* Empty / loading / auth */
.empty,.loading{padding:36px 16px;text-align:center;color:var(--text2);font-size:14px}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--bg2);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.auth{display:grid;place-items:center;min-height:80vh;padding:20px}
.auth .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;max-width:360px;text-align:center;box-shadow:var(--shadow)}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e8eaee;color:#14181d;padding:10px 16px;border-radius:6px;font-size:13px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.25);animation:fadeIn .15s;max-width:90vw;text-align:center}
@media(prefers-color-scheme:light){.toast{background:#111;color:#fff}}
.toast.err{background:var(--red);color:#fff}
@keyframes fadeIn{from{opacity:0}}
.note{font-size:11.5px;color:var(--text3);line-height:1.5}
:where(button,select,input,a,textarea):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div><div>Loading...</div></div></div>
<div id="toasts"></div>
<script>
// === CONFIG (shared with production.html) ===
const CLIENT_ID='127c307a-e672-4d13-b5e9-c3b96fb34759';
const TENANT_ID='1585f578-f5d3-41e6-a437-9c59bd33fbcf';
const SCOPES=['Files.ReadWrite','Files.ReadWrite.All','Sites.ReadWrite.All','User.Read','offline_access'];
const FD_SITE='valentiheld.sharepoint.com,faa2c371-4166-4fc1-aed9-bf6ff65c7034,d89c0495-1617-4429-b05b-7addf584b82e';
const TS_SITE='valentiheld.sharepoint.com,155c9359-7fd3-4f2c-8c6a-b04a722b6f64,801969a1-b2a1-4f9a-8c3a-05ae5405e710';
const TSJL_LIST='228b5d0b-c95c-4bd0-a9b2-b963d767b7d2';
const FD_LIST='0e317e27-adb1-4bef-b57a-cb0524e60981'; // Field Data production log
const FALLBACK_ADMINS=['dmorris@valentiheld.com','abewley@valentiheld.com','jroe@valentiheld.com','jtrenkamp@valentiheld.com','cbroeker@valentiheld.com','eroe@valentiheld.com','cwaters@valentiheld.com','mzielinski@valentiheld.com','mjanson@valentiheld.com','kpero@valentiheld.com','jschuetz@valentiheld.com'];
const SCOPE_LIST_NAME='JobScope';
const STATUS_LIST_NAME='TrackerStatus';
const PHASE_LABELS={'300':'Earth — Mass','310':'Earth — Finish','400':'Storm','450':'Storm — Other','500':'Sanitary','600':'Water'};
const VH_TRK_BUILD='2026-11-15.22';
console.log('[VH] Job Trackers build',VH_TRK_BUILD);

let mi;
let auth={user:null,account:null,isAdmin:false};
let S={view:'portfolio',job:'',phase:'ALL',lists:null,scope:[],status:{},prod:[],loaded:false,imp:null,busy:false,setupErr:'',cmap:null};

// === MSAL ===
async function initMsal(){
  if(typeof msal==='undefined'||!msal.PublicClientApplication){throw new Error('MSAL failed to load from CDN.');}
  mi=new msal.PublicClientApplication({
    auth:{clientId:CLIENT_ID,authority:`https://login.microsoftonline.com/${TENANT_ID}`,redirectUri:window.location.origin+window.location.pathname},
    cache:{cacheLocation:'localStorage'}
  });
  await mi.initialize();
  await mi.handleRedirectPromise();
  const accs=mi.getAllAccounts();
  if(accs.length>0){
    auth.account=accs[0];
    auth.user={name:accs[0].name,email:(accs[0].username||'').toLowerCase()};
    await loadRoles();
    await ensureLists();
    if(S.lists){await loadAll();}
    if(S.lists&&!S.loaded&&!S.loadErr)S.loadErr='Sign-in token not available ('+(S.tokErr||'no token')+').';
    render();
  } else renderAuth();
}
async function signIn(){await mi.loginRedirect({scopes:SCOPES,prompt:'select_account'});}
async function signOut(){await mi.logoutRedirect();}
let __authToastAt=0;
async function getToken(interactive){
  try{const r=await mi.acquireTokenSilent({scopes:SCOPES,account:auth.account});return r.accessToken;}
  catch(e){
    S.tokErr=(e&&(e.errorCode||e.message))||'unknown';
    if(e instanceof msal.InteractionRequiredAuthError){
      if(interactive){await mi.acquireTokenRedirect({scopes:SCOPES,account:auth.account});}
      else if(Date.now()-__authToastAt>60000){__authToastAt=Date.now();toast('Session expired — sign in again to refresh.','err');}
    }
    return null;
  }
}
async function loadRoles(){
  try{
    const tok=await getToken();if(!tok)throw new Error('no token');
    const r=await fetch(`https://graph.microsoft.com/v1.0/sites/${TS_SITE}/drive/root:/vhts-state.json:/content`,{headers:{Authorization:'Bearer '+tok}});
    if(r.ok){const j=await r.json();auth.isAdmin=(j.adminEmails||[]).map(e=>(e||'').toLowerCase()).includes(auth.user.email);return;}
    throw new Error('no state file');
  }catch(e){auth.isAdmin=FALLBACK_ADMINS.includes(auth.user.email);}
}
// Paginated GET — same rationale as production.html: a single page silently truncates.
async function vhGetAll(tok,url,label){
  const out=[];let next=url,pages=0;
  while(next&&pages<50){
    const r=await fetch(next,{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok)throw new Error((label||'fetch')+' Graph '+r.status);
    const j=await r.json();
    if(j.value)out.push(...j.value);
    next=j['@odata.nextLink']||null;pages++;
  }
  if(next)console.warn('[VH]',label,'hit 50-page cap');
  return out;
}

// === LIST DISCOVERY / CREATION ===
// Lists are found by displayName so nobody ever pastes a GUID; ids cached per-browser.
async function ensureLists(){
  const cached=localStorage.getItem('vhtrk_lists');
  if(cached){try{S.lists=JSON.parse(cached);return;}catch(e){}}
  const tok=await getToken();if(!tok)return;
  try{
    const lists=await vhGetAll(tok,`https://graph.microsoft.com/v1.0/sites/${FD_SITE}/lists?$select=id,displayName&$top=200`,'lists');
    const find=n=>lists.find(l=>(l.displayName||'').toLowerCase()===n.toLowerCase());
    const sc=find(SCOPE_LIST_NAME),st=find(STATUS_LIST_NAME);
    if(sc&&st){S.lists={scope:sc.id,status:st.id};localStorage.setItem('vhtrk_lists',JSON.stringify(S.lists));}
    else S.lists=null; // triggers setup screen
  }catch(e){console.warn('ensureLists:',e);S.lists=null;}
}
async function rescanLists(){
  if(S.busy)return;S.busy=true;S.setupErr='';render();
  localStorage.removeItem('vhtrk_lists');S.cmap=null;
  await ensureLists();
  if(S.lists){await loadAll();toast('Lists found');}
  else toast('Lists not found yet','err');
  S.busy=false;render();
}
async function createLists(){
  if(S.busy)return;S.busy=true;S.setupErr='';render();
  try{
    const tok=await getToken(true);if(!tok)throw new Error('Sign-in expired — tap again after signing in.');
    // Idempotent: find what already exists first, so a partial earlier attempt (or a
    // manually created list) is reused instead of failing on "name already exists".
    const lists=await vhGetAll(tok,`https://graph.microsoft.com/v1.0/sites/${FD_SITE}/lists?$select=id,displayName&$top=200`,'lists');
    const find=n=>{const l=lists.find(x=>(x.displayName||'').toLowerCase()===n.toLowerCase());return l?l.id:null;};
    let scopeId=find(SCOPE_LIST_NAME), statusId=find(STATUS_LIST_NAME);
    const mk=async(body)=>{
      const r=await fetch(`https://graph.microsoft.com/v1.0/sites/${FD_SITE}/lists`,{
        method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok){
        let msg='HTTP '+r.status;
        try{const j=await r.json();if(j.error&&j.error.message)msg+=' — '+j.error.message;}catch(e2){}
        if(r.status===403)msg+=' (no permission to create lists on the Field Operations site — use the manual steps below, the app will find the lists by name)';
        throw new Error('Creating "'+body.displayName+'": '+msg);
      }
      return (await r.json()).id;
    };
    const txt=n=>({name:n,text:{}}), num=n=>({name:n,number:{}});
    if(!scopeId)scopeId=await mk({displayName:SCOPE_LIST_NAME,list:{template:'genericList'},
      columns:[txt('JobNum'),txt('Phase'),txt('Discipline'),txt('ItemType'),txt('Descr'),num('BidHrs'),num('BidQty'),txt('Unit'),txt('Area')]});
    if(!statusId)statusId=await mk({displayName:STATUS_LIST_NAME,list:{template:'genericList'},
      columns:[txt('JobNum'),txt('ItemID'),num('PctDone'),txt('Note')]});
    S.lists={scope:scopeId,status:statusId};
    localStorage.setItem('vhtrk_lists',JSON.stringify(S.lists));
    toast('Lists ready on Field Operations site');
    await loadAll();
  }catch(e){S.setupErr=e.message;}
  S.busy=false;render();
}

// === DATA ===
const WANT_COLS={scope:['JobNum','Phase','Discipline','ItemType','Descr','BidHrs','BidQty','Unit','Area'],
                 status:['JobNum','ItemID','PctDone','Note']};
async function resolveCols(tok){
  S.cmap={scope:{},status:{}};
  for(const k of ['scope','status']){
    const cols=await vhGetAll(tok,`https://graph.microsoft.com/v1.0/sites/${FD_SITE}/lists/${S.lists[k]}/columns?$select=name,displayName&$top=200`,'columns');
    for(const w of WANT_COLS[k]){
      const exact=cols.find(c=>c.name.toLowerCase()===w.toLowerCase());
      const disp=cols.find(c=>(c.displayName||'').toLowerCase()===w.toLowerCase());
      S.cmap[k][w]=(exact||disp||{name:w}).name;
    }
  }
}
function packFields(kind,logical){ // {logicalName:value} -> {internalName:value}; Title passes through
  const m=S.cmap[kind],out={};
  for(const[k,v]of Object.entries(logical))out[k==='Title'?'Title':(m[k]||k)]=v;
  return out;
}
async function loadAll(){
  try{
    const tok=await getToken();if(!tok)return;
    if(!S.cmap)await resolveCols(tok);
    const [scopeItems,statusItems,fdItems]=await Promise.all([
      vhGetAll(tok,`https://graph.microsoft.com/v1.0/sites/${FD_SITE}/lists/${S.lists.scope}/items?$expand=fields&$top=999`,'JobScope'),
      vhGetAll(tok,`https://graph.microsoft.com/v1.0/sites/${FD_SITE}/lists/${S.lists.status}/items?$expand=fields&$top=999`,'TrackerStatus'),
      // Burned hours come from the PRODUCTION log (Field Data), not timesheets:
      // bid hours are production-rate hours, so only Production Hours per crew-day compare apples-to-apples.
      vhGetAll(tok,`https://graph.microsoft.com/v1.0/sites/${FD_SITE}/lists/${FD_LIST}/items?$expand=fields&$top=999`,'Field Data')
    ]);
    const cs=S.cmap.scope,ct=S.cmap.status;
    S.scope=scopeItems.map(it=>({spId:it.id,ItemID:it.fields.Title||'',JobNum:String(it.fields[cs.JobNum]||'').trim(),
      Phase:String(it.fields[cs.Phase]||'').trim(),Discipline:it.fields[cs.Discipline]||'',ItemType:(it.fields[cs.ItemType]||'run').toLowerCase(),
      Descr:it.fields[cs.Descr]||'',BidHrs:+it.fields[cs.BidHrs]||0,BidQty:+it.fields[cs.BidQty]||0,Unit:it.fields[cs.Unit]||'',Area:it.fields[cs.Area]||''}))
      .filter(r=>r.ItemID&&r.JobNum);
    S.status={};
    statusItems.forEach(it=>{
      const k=String(it.fields[ct.JobNum]||'').trim()+'|'+String(it.fields[ct.ItemID]||'').trim();
      S.status[k]={spId:it.id,pct:Math.max(0,Math.min(100,Math.round((+it.fields[ct.PctDone]||0)*10)/10)),note:it.fields[ct.Note]||''};
    });
    S.prod=fdItems.map(it=>it.fields).filter(f=>f&&(f.Jobnumber||f['STR_x0020_ID']));
    S._aq={}; // reported-qty cache follows Field Data
    S.loaded=true;
    setTimeout(()=>saveOfficeTracker(true),4000); // keep the office copy fresh (at most every 30 min per device)
    setTimeout(()=>pkAuto(),1500); // pick up new job folders / new field packets
  }catch(e){console.warn('loadAll:',e);S.loadErr='Load failed: '+e.message;toast('Load failed: '+e.message,'err');}
}
async function refresh(){toast('Refreshing…');await loadAll();if(S.view==='earth'){S.earth=null;await loadEarth();}render();toast('Up to date');}

// === STATUS UPSERT (PATCH-if-exists-else-POST, optimistic UI) ===
const __pending={};
async function setPct(job,itemId,pct){
  const k=job+'|'+itemId;
  const prev=S.status[k]?{...S.status[k]}:null;
  pct=Math.round(pct*10)/10;
  S.status[k]=Object.assign({spId:prev?prev.spId:null,note:prev?prev.note:''},{pct});
  render(); // optimistic
  if(__pending[k])clearTimeout(__pending[k]);
  __pending[k]=setTimeout(async()=>{
    delete __pending[k];
    try{
      const tok=await getToken(true);if(!tok)throw new Error('no token');
      const cur=S.status[k];
      if(cur.spId){
        const r=await fetch(`https://graph.microsoft.com/v1.0/sites/${FD_SITE}/lists/${S.lists.status}/items/${cur.spId}/fields`,{
          method:'PATCH',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json','If-Match':'*'},
          body:JSON.stringify(packFields('status',{PctDone:cur.pct}))});
        if(!r.ok)throw new Error('PATCH '+r.status);
      }else{
        const r=await fetch(`https://graph.microsoft.com/v1.0/sites/${FD_SITE}/lists/${S.lists.status}/items`,{
          method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
          body:JSON.stringify({fields:packFields('status',{Title:k,JobNum:job,ItemID:itemId,PctDone:cur.pct})})});
        if(!r.ok)throw new Error('POST '+r.status);
        const j=await r.json();S.status[k].spId=j.id;
      }
    }catch(e){
      if(prev)S.status[k]=prev;else delete S.status[k];
      render();toast('Save failed for '+itemId+' — change reverted','err');
    }
  },450); // debounce rapid taps on the same run
}
function pctOf(job,itemId){const s=S.status[job+'|'+itemId];return s?s.pct:0;}

// === MATH ===
const nid=s=>String(s||'').toUpperCase().replace(/\s+/g,''); // foremen type STR IDs free-hand
function actualByJobPhase(job){
  const m={};
  S.prod.forEach(l=>{
    if(String(l.Jobnumber||'').trim()!==job)return;
    const ph=String(l.Phase||'').trim()||'?';
    m[ph]=(m[ph]||0)+(+l['Production_x0020_Hours']||0);
  });
  return m;
}
function actualByItem(job){ // production hours grouped by STR ID from the crews' daily reports
  const m={};let any=false;
  S.prod.forEach(l=>{
    if(String(l.Jobnumber||'').trim()!==job)return;
    const id=nid(l['STR_x0020_ID']);
    if(!id)return;any=true;
    m[id]=(m[id]||0)+(+l['Production_x0020_Hours']||0);
  });
  return any?m:null;
}
function autoQtyByItem(job){ // installed quantity reported on the crews' production forms, by STR ID
  if(!S._aq)S._aq={};
  if(S._aq[job])return S._aq[job];
  const m={};
  S.prod.forEach(l=>{
    if(String(l.Jobnumber||'').trim()!==job)return;
    const id=nid(l['STR_x0020_ID']);if(!id)return;
    const q=parseFloat(String(l['Yardage_x002f_production']||'').replace(/,/g,''));
    if(q>0)m[id]=(m[id]||0)+q;
  });
  S._aq[job]=m;return m;
}
// Effective % done = the higher of the manually tapped value and the value implied by
// reported production quantity vs bid quantity. Production reports advance progress
// automatically; taps can push higher; downward corrections are made by fixing the
// production report (or Installed qty), since footage on the books shouldn't vanish.
function effPct(job,r){
  const man=pctOf(job,r.ItemID);
  let auto=0;
  if(r.BidQty>0){
    const q=autoQtyByItem(job)[nid(r.ItemID)]||0;
    if(q>0)auto=Math.min(100,q/r.BidQty*100);
  }
  return Math.max(man,Math.round(auto*10)/10);
}
function jobSummary(job){
  const rows=S.scope.filter(r=>r.JobNum===job);
  let bid=0,earned=0;
  rows.forEach(r=>{bid+=r.BidHrs;earned+=r.BidHrs*effPct(job,r)/100;});
  const act=actualByJobPhase(job);
  const actual=Object.values(act).reduce((a,b)=>a+b,0);
  return {bid,earned,actual,pct:bid?earned/bid*100:0,items:rows.length};
}
function fmt(n){return (Math.round(n*10)/10).toLocaleString();}
function fmt0(n){return Math.round(n).toLocaleString();}

// === RENDER ===
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,cls){
  const t=document.createElement('div');t.className='toast'+(cls?' '+cls:'');t.textContent=msg;
  document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),2600);
}

function renderJob(){
  const job=S.job;
  const rows=S.scope.filter(r=>r.JobNum===job);
  if(!rows.length)return `<div class="sec"><div class="empty">No scope rows for ${esc(job)}.</div></div>`;
  const phases=[...new Set(rows.map(r=>r.Phase))].sort();

    phases.map(p=>`<button class="chip${S.phase===p?' on':''}" onclick="S.phase='${esc(p)}';render()">${esc(PHASE_LABELS[p]||('Phase '+p))}</button>`).join('')+`</div>`;

    ${actItem?'':'<p class="note" style="margin-top:4px"><i class="ti ti-info-circle"></i> Burned hours shown per phase only — per-run burn appears once daily production reports carry an STR ID for this job.</p>'}`;

function renderPhase(job,rows,phase,actual,actItem){
  let bid=0,earned=0;
  rows.forEach(r=>{bid+=r.BidHrs;earned+=r.BidHrs*effPct(job,r)/100;});
  const varr=actual-earned;
  const lots=rows.filter(r=>r.ItemType==='lot'||r.ItemType==='lateral')
    .sort((a,b)=>String(a.ItemID).localeCompare(String(b.ItemID),undefined,{numeric:true})); // lot 2 before lot 10
  const runs=rows.filter(r=>!(r.ItemType==='lot'||r.ItemType==='lateral'));
  // group runs by Area
  const areas={};runs.forEach(r=>{(areas[r.Area||'']=areas[r.Area||'']||[]).push(r);});
  const areaKeys=Object.keys(areas).sort();
  const runHtml=areaKeys.map(a=>{
    const list=areas[a];
    let ab=0,ae=0;list.forEach(r=>{ab+=r.BidHrs;ae+=r.BidHrs*effPct(job,r)/100;});
    const head=a?`<div class="area-h"><span>${esc(a)}</span><span class="ah-num">${fmt0(ae)} / ${fmt0(ab)} hrs</span></div>`:'';
    return head+list.map(r=>runRow(job,r,actItem)).join('');
  }).join('');
  const lotHtml=lots.length?`<div class="area-h"><span>Laterals — tap lot when tied in</span>
      <span class="ah-num">${lots.filter(r=>effPct(job,r)>=100).length} / ${lots.length} done</span></div>
    <div class="lots">${lots.map(r=>{
      const done=effPct(job,r)>=100;
      return `<button class="lot${done?' done':''}" onclick="setPct('${esc(job)}','${esc(r.ItemID)}',${done?0:100})" title="${esc(r.Descr)}">${esc(r.ItemID.replace(/^LOT-?/i,''))}</button>`;
    }).join('')}</div>`:'';
  return `<div class="sec"><h2>${esc(PHASE_LABELS[phase]||('Phase '+phase))} <span class="h2-sub">phase ${esc(phase)} · ${rows.length} items</span></h2>
    <div class="pstrip">
      <span>Bid <b>${fmt0(bid)}</b></span><span>Earned <b>${fmt0(earned)}</b></span>
      <span>Burned <b class="${varr>0.5?'ov':''}">${fmt0(actual)}</b></span>
      <span>Remaining <b>${fmt0(bid-earned)}</b></span>
      <span>Variance <b class="${varr>0.5?'ov':(varr<-0.5?'un':'')}">${varr>0?'+':''}${fmt0(varr)}</b></span>
    </div>${runHtml}${lotHtml}</div>`;
}
function runRow(job,r,actItem){
  const man=pctOf(job,r.ItemID);
  const pct=effPct(job,r);
  const isAuto=pct>man+0.05; // progress currently driven by production reports
  const burned=actItem?(actItem[nid(r.ItemID)]||0):null;
  const rp=Math.round(pct);
  const seg=[0,25,50,75,100].map(v=>
    `<button class="${rp===v?'on'+(v===100?' full':''):''}" onclick="setPct('${esc(job)}','${esc(r.ItemID)}',${v})">${v===100?'✓':v||'—'}</button>`).join('');
  const qtyBit=r.BidQty>0
    ?`<button class="qbtn" title="${isAuto?'from crew production reports':'tap to set installed qty'}" onclick="editInstalled('${esc(job)}','${esc(r.ItemID)}')">${isAuto?'<i class="ti ti-bolt" style="font-size:11px"></i> ':''}${fmt(Math.round(r.BidQty*pct/100))}/${fmt(r.BidQty)} ${esc(r.Unit)}${[0,25,50,75,100].includes(rp)?'':' · '+rp+'%'}</button>`
    :'';
  return `<div class="run">
    <span class="run-id">${esc(r.ItemID)}</span>
    <span class="run-desc">${esc(r.Descr)}</span>
    ${qtyBit}
    <span class="run-bid"><b>${fmt(r.BidHrs)}</b>${burned!=null?` / ${fmt(burned)}`:''} h</span>
    <div class="pcts">${seg}</div></div>`;
}
function editInstalled(job,itemId){
  const r=S.scope.find(x=>x.JobNum===job&&x.ItemID===itemId);
  if(!r||!(r.BidQty>0))return;
  const cur=Math.round(r.BidQty*effPct(job,r)/100);
  const v=prompt('Installed '+(r.Unit||'qty')+' for '+itemId+' (of '+fmt(r.BidQty)+')',cur);
  if(v==null)return;
  const n=parseFloat(String(v).replace(/,/g,''));
  if(isNaN(n)||n<0){toast('Enter a number','err');return;}
  setPct(job,itemId,Math.max(0,Math.min(100,n/r.BidQty*100)));
}

        'Bid Cost':s.bidC?Math.round(s.bidC):'','Cost To Date':Math.round(s.cost),'Bid $/Unit':isFinite(s.bidU)?Math.round(s.bidU*100)/100:'','Actual $/Unit':isFinite(s.actU)?Math.round(s.actU*100)/100:'',
        'Over(-)/Under(+)':v===''||!s.qty?'':Math.round(v),'Projected Final Cost':isFinite(s.proj)?Math.round(s.proj):'','Machines Without A Rate':Object.values(d.equip).filter(x=>x.cat===null).length||''});
      Object.keys(d.ph[ph].days).sort().forEach(dt=>{const x=d.ph[ph].days[dt];

  if(sum.length){const ws=XLSX.utils.json_to_sheet(sum);ws['!cols']=Object.keys(sum[0]).map(k=>({wch:Math.max(10,k.length+2)}));XLSX.utils.book_append_sheet(wb,ws,'Earthwork');}
  if(daily.length){const ws=XLSX.utils.json_to_sheet(daily);ws['!cols']=Object.keys(daily[0]).map(k=>({wch:Math.max(10,k.length+2)}));XLSX.utils.book_append_sheet(wb,ws,'Earthwork Daily');}
}
// The office copy: the same workbook saved into the Field folder so anyone can open it without the app.
const OFFICE_FILE='Field/VH Job Tracker.xlsx';
async function saveOfficeTracker(auto){
  try{
    if(typeof XLSX==='undefined'||!S.loaded)return;
    if(auto){const last=+localStorage.getItem('vhtrk_office_saved')||0;if(Date.now()-last<30*60000)return;}
    const tok=await getToken(!auto);if(!tok)return;
    if(!S.earth&&!S.earthLoading)await loadEarth(true); // quiet: no re-render under someone typing
    const wb=buildTrackerWb('',true);if(!wb){if(!auto)toast('Nothing to save yet','err');return;}
    const who=(auth.user&&auth.user.name)||'';
    const info=XLSX.utils.aoa_to_sheet([['VH Job Tracker'],['Updated',new Date().toLocaleString()],['Updated by',who],[],['This file is written by the tracker app. Do not edit it here: changes are overwritten the next time it updates.'],['Open the tracker app to change progress or earthwork setup.']]);
    info['!cols']=[{wch:14},{wch:60}];
    XLSX.utils.book_append_sheet(wb,info,'About');
    wb.SheetNames.unshift(wb.SheetNames.pop()); // About first
    const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    const url='https://graph.microsoft.com/v1.0/drives/'+EW_DRIVE+'/root:/'+OFFICE_FILE.split('/').map(encodeURIComponent).join('/')+':/content';
    const r=await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},body:buf});
    if(r.status===423||r.status===409){if(!auto)toast('The office copy is open in Excel and locked. Close it and try again.','err');return;}
    if(!r.ok)throw new Error('save '+r.status);
    localStorage.setItem('vhtrk_office_saved',String(Date.now()));
    if(!auto)toast('Office copy saved to the Field folder');
  }catch(e){console.warn('office copy',e);if(!auto)toast('Office copy failed: '+e.message,'err');}
}
function buildTrackerWb(job,withEarth){
  const rows=S.scope.filter(r=>!job||r.JobNum===job);
  const wb=XLSX.utils.book_new();
  if(withEarth)ewSheets(wb);
  if(!rows.length)return wb.SheetNames.length?wb:null;
  // Summary: one row per job+phase — the remaining-hours numbers the schedule runs on
  const sum={};
  rows.forEach(r=>{
    const k=r.JobNum+'|'+r.Phase;
    const o=sum[k]=sum[k]||{job:r.JobNum,ph:r.Phase,bid:0,earn:0,items:0,done:0};
    const pct=effPct(r.JobNum,r);
    o.bid+=r.BidHrs;o.earn+=r.BidHrs*pct/100;o.items++;if(pct>=100)o.done++;
  });
  const sumRows=Object.values(sum).sort((a,b)=>a.job.localeCompare(b.job)||a.ph.localeCompare(b.ph)).map(o=>{
    const act=(actualByJobPhase(o.job)[o.ph])||0;
    return {'Job':o.job,'Phase':o.ph,'Discipline':PHASE_LABELS[o.ph]||'','Bid Hrs':r1(o.bid),'Earned Hrs':r1(o.earn),
      'Burned Hrs':r1(act),'Remaining Hrs':r1(o.bid-o.earn),'Variance Hrs':r1(act-o.earn),
      '% Complete':o.bid?r1(o.earn/o.bid*100):0,'Items':o.items,'Items Done':o.done};
  });
  const ws1=XLSX.utils.json_to_sheet(sumRows);
  ws1['!cols']=Object.keys(sumRows[0]).map(k=>({wch:Math.max(10,k.length+2)}));
  XLSX.utils.book_append_sheet(wb,ws1,'Summary');
  // Runs: per-item detail
  const aiCache={};
  const detRows=rows.slice().sort((a,b)=>a.JobNum.localeCompare(b.JobNum)||a.Phase.localeCompare(b.Phase)||String(a.Area).localeCompare(String(b.Area))).map(r=>{
    if(!(r.JobNum in aiCache))aiCache[r.JobNum]=actualByItem(r.JobNum);
    const pct=effPct(r.JobNum,r);
    const row={'Job':r.JobNum,'Phase':r.Phase,'Area':r.Area,'ID':r.ItemID,'Type':r.ItemType,'Description':r.Descr,
      'Bid Qty':r.BidQty||'','Unit':r.Unit,'Installed':r.BidQty?r1(r.BidQty*pct/100):'','% Done':r1(pct),
      'Bid Hrs':r1(r.BidHrs),'Earned Hrs':r1(r.BidHrs*pct/100),'Remaining Hrs':r1(r.BidHrs*(1-pct/100))};
    const ai=aiCache[r.JobNum];
    row['Burned Hrs']=ai?r1(ai[nid(r.ItemID)]||0):'';
    return row;
  });
  const ws2=XLSX.utils.json_to_sheet(detRows);
  ws2['!cols']=Object.keys(detRows[0]).map(k=>({wch:k==='Description'?32:Math.max(9,k.length+2)}));
  XLSX.utils.book_append_sheet(wb,ws2,'Runs');
  if(withEarth){const n=wb.SheetNames;['Runs','Summary'].forEach(s=>{const i=n.indexOf(s);if(i>0){n.splice(i,1);n.unshift(s);}});} // Summary, Runs, then Earthwork
  return wb;
}
// === IMPORT ===
const IMP_FIELDS=[['ItemID','ID / Run'],['Descr','Description'],['BidHrs','Bid hrs'],['BidQty','Qty'],['Unit','Unit'],['Area','Area'],['Phase','Phase'],['ItemType','Type'],['PctDone','% done / X / date']];
function guessCol(h){
  const s=h.toLowerCase().replace(/[^a-z0-9]/g,'');
  if(/^(itemid|runid|run|id|structure|str)$/.test(s))return 'ItemID';
  if(/desc/.test(s))return 'Descr';
  if(/^(pctdone|percentdone|pctcomplete|done|pct|percent|complete|tiedin|datetied|tied)$/.test(s))return 'PctDone';
  if(/bid/.test(s))return 'BidHrs'; // anything with "bid" is the bid number, even "bid hrs (pipe+MH+wye)"
  if(/pipe|prod|rate|earned|remaining|hrsdone/.test(s))return ''; // per-run derived columns: never auto-map
  if(/hours|hrs/.test(s))return 'BidHrs';
  if(/qty|quantity|lf|length/.test(s))return 'BidQty';
  if(/unit/.test(s))return 'Unit';
  if(/area|section/.test(s))return 'Area';
  if(/phase/.test(s))return 'Phase';
  if(/type/.test(s))return 'ItemType';
  return '';
}
function impParse(){
  const txt=document.getElementById('imp-txt').value;
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2){toast('Paste at least a header row and one data row','err');return;}
  const delim=lines[0].includes('\t')?'\t':',';
  let headers=lines[0].split(delim).map(h=>h.trim());
  const rows=lines.slice(1).map(l=>l.split(delim).map(c=>c.trim()));
  const maxCols=Math.max(headers.length,...rows.map(r=>r.length));
  while(headers.length<maxCols)headers.push('Col '+(headers.length+1));
  S.imp={headers,rows,map:headers.map(guessCol),job:S.imp&&S.imp.job||S.job||'',defPhase:S.imp&&S.imp.defPhase||'',defType:'run',replace:true,prog:-1};
  render();
}
function impSetMap(i,v){S.imp.map[i]=v;impSync();}
function impSync(){

  const btn=document.getElementById('imp-up');

function impRows(){
  const {headers,rows,map,job,defPhase,defType}=S.imp;
  const idx={};const dups=[];
  map.forEach((m,i)=>{if(!m)return;if(m in idx)dups.push(m);else idx[m]=i;});
  if(dups.length)return {err:'Two columns are mapped to the same field ('+[...new Set(dups)].join(', ')+') — set one to skip.'};
  if(!('ItemID' in idx))return {err:'Map a column to ID / Run.'};
  if(!job.trim())return {err:'Enter the job number.'};
  const out=[];const pcts=[];
  rows.forEach(r=>{
    const g=f=>(f in idx)?(r[idx[f]]||''):'';
    const id=g('ItemID');if(!id)return;
    out.push({Title:id,JobNum:job.trim(),Phase:(g('Phase')||defPhase||'').trim(),
      ItemType:(g('ItemType')||defType||'run').toLowerCase(),Descr:g('Descr'),
      BidHrs:parseFloat(String(g('BidHrs')).replace(/,/g,''))||0,
      BidQty:parseFloat(String(g('BidQty')).replace(/,/g,''))||0,
      Unit:g('Unit'),Area:g('Area')});
    if('PctDone' in idx){
      const raw=String(g('PctDone')).trim();
      if(raw){
        // Field crews mark tied-in lots with X / check / a date, not a percent — all mean 100.
        // Dates MUST be caught before parseFloat: parseFloat('6/12') would seed 6%.
        if(/^(x+|✓|✔|yes|y|done|complete|comp|tied.?in|true)$/i.test(raw)
           ||/^\d{1,2}[\/\-.]\d{1,2}([\/\-.]\d{2,4})?$/.test(raw)){
          pcts.push({itemId:id,pct:100});
        }else{
          const p=parseFloat(raw.replace(/[%,]/g,''));
          if(!isNaN(p)&&p>0)pcts.push({itemId:id,pct:Math.max(0,Math.min(100,p<=1?p*100:p))});
        }
      }
    }
  });
  return {rows:out,pcts};
}
async function impUpload(){
  if(S.busy)return;
  const p=impRows();
  if(p.err){toast(p.err,'err');return;}
  if(!p.rows.length){toast('No rows to upload','err');return;}
  S.busy=true;S.imp.prog=0;render();
  try{
    const tok=await getToken(true);if(!tok)throw new Error('no token');
    const job=S.imp.job.trim();
    // replace mode: delete this job's scope rows ONLY where phase AND item type match the
    // incoming rows — mains (run) and laterals (lot) share phase 500 but never clobber each other
    if(S.imp.replace){
      const victims=S.scope.filter(r=>r.JobNum===job&&p.rows.some(n=>n.Phase===r.Phase&&n.ItemType===r.ItemType));
      for(const batch of chunk(victims,20)){
        await gBatch(tok,batch.map((v,i)=>({id:String(i+1),method:'DELETE',
          url:`/sites/${FD_SITE}/lists/${S.lists.scope}/items/${v.spId}`,headers:{'If-Match':'*'}})));
      }
    }
    // batched insert, 20 per $batch call
    let done=0;
    for(const batch of chunk(p.rows,20)){
      const resp=await gBatch(tok,batch.map((row,i)=>({id:String(i+1),method:'POST',
        url:`/sites/${FD_SITE}/lists/${S.lists.scope}/items`,
        headers:{'Content-Type':'application/json'},body:{fields:packFields('scope',row)}})));
      const bad=resp.filter(r=>r.status>=400);
      if(bad.length)throw new Error(bad.length+' rows failed (HTTP '+bad[0].status+')');
      done+=batch.length;S.imp.prog=done/p.rows.length*100;render();
    }
    // seed progress from the imported % done column (statuses key on JobNum|ItemID,
    // so they survive scope re-imports)
    if(p.pcts&&p.pcts.length){
      for(const batch of chunk(p.pcts,20)){
        await gBatch(tok,batch.map((x,i)=>{
          const key=job+'|'+x.itemId;const cur=S.status[key];
          return cur&&cur.spId
            ?{id:String(i+1),method:'PATCH',url:`/sites/${FD_SITE}/lists/${S.lists.status}/items/${cur.spId}/fields`,
              headers:{'Content-Type':'application/json','If-Match':'*'},body:packFields('status',{PctDone:x.pct})}
            :{id:String(i+1),method:'POST',url:`/sites/${FD_SITE}/lists/${S.lists.status}/items`,
              headers:{'Content-Type':'application/json'},body:{fields:packFields('status',{Title:key,JobNum:job,ItemID:x.itemId,PctDone:x.pct})}};
        }));
      }
    }
    toast(done+' scope rows loaded for '+job+(p.pcts&&p.pcts.length?' · '+p.pcts.length+' progress values seeded':''));
    S.imp=null;S.view='job';S.job=job;S.phase='ALL';
    await loadAll();
  }catch(e){toast('Import failed: '+e.message,'err');}
  S.busy=false;render();
}
function chunk(a,n){const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;}
async function gBatch(tok,requests){
  const r=await fetch('https://graph.microsoft.com/v1.0/$batch',{method:'POST',
    headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
    body:JSON.stringify({requests})});
  if(!r.ok)throw new Error('$batch '+r.status);
  return (await r.json()).responses||[];
}

// ===== FIELD PACKET SYNC =======================================================
// No more pasting run tables. The tracker reads each job's field packet straight from
// Field/Jobs/{year}/{job folder}/ and builds the scope from the takeoff tabs:
//   STORM T-OFF -> phase 400 runs, SAN T-OFF -> phase 500 runs, SAN LAT T-OFF -> phase 500 laterals.
// New year folders and new job folders are found automatically. A job with NO scope yet is
// imported on its own; a job that already has scope is only re-synced when an admin approves it,
// because re-syncing replaces rows and progress is tied to run IDs.
const PK_ROOT='Field/Jobs';const PK_STATE=PK_ROOT+'/scope-sync.json';
function pkUrl(p){return 'https://graph.microsoft.com/v1.0/drives/'+EW_DRIVE+'/root:/'+p.split('/').map(encodeURIComponent).join('/');}
function pkNum(v){if(typeof v==='number')return isFinite(v)?v:NaN;if(typeof v==='string'&&v.trim()!==''){const n=Number(v.replace(/,/g,''));return isFinite(n)?n:NaN;}return NaN;}
function pkParseRuns(rows,job,phase){
  const isId=v=>typeof v==='string'&&/^[A-Za-z0-9.()' ]{1,16}\s?-\s?[A-Za-z0-9.()' ]{1,16}$/.test(v.trim())&&!/total/i.test(v);
  // ID column = whichever of the first 4 columns holds the most run IDs followed by a length
  let idc=-1,best=0;
  for(let c=0;c<4;c++){let n=0;rows.forEach(r=>{if(r&&isId(r[c])&&pkNum(r[c+1])>0)n++;});if(n>best){best=n;idc=c;}}
  if(idc<0)return [];
  const lc=idc+1;
  // Hours column: the column k where length / (some rate column j) = k on most rows. Layout-independent,
  // so it does not matter that storm calls it "Bid Hours" and sanitary calls it "prod".
  const votes={};
  rows.forEach(r=>{if(!r||!isId(r[idc]))return;const L=pkNum(r[lc]);if(!(L>0))return;
    // length / rate = hours holds both ways round, so the pair alone cannot say which is which.
    // In every packet the rate column sits to the LEFT of the hours column, so only j<k counts.
    for(let j=lc+1;j<=lc+14;j++){const rate=pkNum(r[j]);if(!(rate>0))continue;
      for(let k=j+1;k<=lc+14;k++){const h=pkNum(r[k]);if(!(h>0))continue;
        if(Math.abs(L/rate-h)<=0.011*Math.max(1,h))votes[k]=(votes[k]||0)+1;}}});
  const hc=Object.keys(votes).sort((a,b)=>votes[b]-votes[a])[0];
  const out=[];const seen={};let area='';
  rows.forEach(r=>{if(!r)return;const v=r[idc];
    if(typeof v==='string'&&/^[A-Za-z]{0,3}\d+\.\d+[A-Za-z]?$/.test(v.trim())&&!(pkNum(r[lc])>0)){area=v.trim();return;} // plan sheet marker, e.g. C6.15
    if(!isId(v))return;const L=pkNum(r[lc]);if(!(L>0))return;
    let id=v.trim().replace(/\s*-\s*/,'-').toUpperCase();
    seen[id]=(seen[id]||0)+1;if(seen[id]>1)id+=' ('+seen[id]+')'; // twin runs keep their own row
    const size=pkNum(r[lc+1]),depth=pkNum(r[lc+2]);
    const h=hc!=null?pkNum(r[+hc]):NaN;
    out.push({Title:id,JobNum:job,Phase:phase,ItemType:'run',Descr:(size>0?size+'" pipe':'')+(depth>0?(size>0?', ':'')+depth+' ft deep':''),
      BidHrs:h>0?Math.round(h*100)/100:0,BidQty:Math.round(L*10)/10,Unit:'LF',Area:area});});
  return out;
}
function pkParseLats(rows,job){
  let hr=-1,cols=[];
  for(let i=0;i<Math.min(rows.length,40);i++){const r=rows[i]||[];const c=[];r.forEach((v,ci)=>{if(typeof v==='string'&&/^lot\s*#?$/i.test(v.trim()))c.push(ci);});if(c.length){hr=i;cols=c;break;}}
  if(hr<0)return [];
  let rate=NaN;
  rows.forEach(r=>{if(!r||isFinite(rate))return;r.forEach((v,ci)=>{if(isFinite(rate))return;if(typeof v==='string'&&/bid\s*prod/i.test(v)){for(let k=ci+1;k<ci+6;k++){const n=pkNum(r[k]);if(n>0){rate=n;break;}}}});});
  const out=[];const seen={};
  cols.forEach(c=>{
    const h=rows[hr]||[];let rc=c+1;for(let k=c+1;k<=c+3;k++){if(typeof h[k]==='string'&&/pipe\s*run/i.test(h[k])){rc=k;break;}}
    for(let i=hr+1;i<rows.length;i++){const r=rows[i]||[];const lot=r[c];
      const ls=(typeof lot==='number')?String(lot):(typeof lot==='string'?lot.trim():'');
      if(!/^\d+[A-Za-z]?$/.test(ls))continue;const L=pkNum(r[rc]);if(!(L>0))continue;
      if(seen[ls])continue;seen[ls]=1;
      out.push({Title:ls,JobNum:job,Phase:'500',ItemType:'lateral',Descr:'Lateral, lot '+ls,BidHrs:rate>0?Math.round(L/rate*100)/100:0,BidQty:L,Unit:'LF',Area:''});}
  });
  return out;
}
// Earthwork bid numbers and the rate sheet, read from the same packet
function pkParseEarth(wb){
  const sheet=re=>{const n=wb.SheetNames.find(x=>re.test(x));return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):null;};
  const out={};const m=sheet(/mass\s*earthwork\s*tracker/i);
  if(m){const costs=[];
    m.forEach(r=>{if(!r)return;r.forEach((v,ci)=>{if(typeof v!=='string')return;const s=v.toUpperCase();
      const left=()=>{for(let k=ci-1;k>=0&&k>=ci-3;k--){const n=pkNum(r[k]);if(n>0)return n;}return 0;};
      const right=()=>{for(let k=ci+1;k<=ci+3;k++){const n=pkNum(r[k]);if(n>0)return n;}return 0;};
      if(/^BID YARDAGE/.test(s))out.bidCY=Math.round(left());
      else if(/^BID SY/.test(s))out.bidSY=Math.round(left());
      else if(/^BID COST:?$/.test(s.trim()))costs.push(right());});});
    if(costs[0])out.bidCost=Math.round(costs[0]);if(costs[1])out.bidCostFG=Math.round(costs[1]);}
  const rs=sheet(/rate\s*sheet/i);
  if(rs){const rates={};const norm=x=>String(x||'').toUpperCase().replace(/\s+/g,' ').trim();
    const all=EW_MACH.concat(EW_LAB);
    rs.forEach(r=>{if(!r)return;const n=norm(r[0]),v=pkNum(r[1]);if(!n||!(v>0))return;const hit=all.find(c=>norm(c)===n);if(hit)rates[hit]=Math.round(v*100)/100;});
    if(Object.keys(rates).length)out.rates=rates;}
  return out;
}
function pkParse(wb,job){
  const sheet=re=>{const n=wb.SheetNames.find(x=>re.test(x.trim()));return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):null;};
  const st=sheet(/^STORM\s*T-?\s*OFF/i),sa=sheet(/^SAN(ITARY)?\s*T-?\s*OFF/i),sl=sheet(/^SAN(ITARY)?\s*LAT.*T-?\s*OFF/i);
  let rows=[];
  if(st)rows=rows.concat(pkParseRuns(st,job,'400'));
  if(sa)rows=rows.concat(pkParseRuns(sa,job,'500'));
  if(sl)rows=rows.concat(pkParseLats(sl,job));
  return {rows,earth:pkParseEarth(wb)};
}
function pkTotals(rows){const o={};rows.forEach(r=>{const k=r.Phase+'|'+r.ItemType;const x=o[k]=o[k]||{phase:r.Phase,type:r.ItemType,n:0,lf:0,hrs:0};x.n++;x.lf+=r.BidQty;x.hrs+=r.BidHrs;});return Object.values(o);}
async function pkScan(tok){
  const H={Authorization:'Bearer '+tok};
  const kids=async p=>{const r=await fetch(pkUrl(p)+':/children?$select=name,id,folder,file,lastModifiedDateTime&$top=400',{headers:H});if(!r.ok)throw new Error('folder read '+r.status+' ('+p+')');return (await r.json()).value||[];};
  const years=(await kids(PK_ROOT)).filter(k=>k.folder&&/^\d{4}$/.test(k.name));
  const jobs=[];
  for(const y of years){
    const jf=(await kids(PK_ROOT+'/'+y.name)).filter(k=>k.folder&&/^\d{3,5}[A-Za-z]?(?![0-9A-Za-z])/.test(k.name));
    const found=await Promise.all(jf.map(async f=>{
      const files=(await kids(PK_ROOT+'/'+y.name+'/'+f.name)).filter(k=>k.file&&/\.(xlsx|xlsm)$/i.test(k.name)&&/packet/i.test(k.name)&&!/^~\$/.test(k.name));
      files.sort((a,b)=>(/field\s*packet/i.test(b.name)-/field\s*packet/i.test(a.name))||String(b.lastModifiedDateTime).localeCompare(String(a.lastModifiedDateTime)));
      const job=f.name.match(/^\d{3,5}[A-Za-z]?/)[0];
      return {job,year:y.name,folder:f.name,name:f.name.replace(/^\d{3,5}[A-Za-z]?\s*[-_ ]\s*/,''),file:files[0]?{name:files[0].name,id:files[0].id,modified:files[0].lastModifiedDateTime}:null};
    }));
    jobs.push(...found);
  }
  return jobs.sort((a,b)=>a.job.localeCompare(b.job));
}
async function pkState(tok){const r=await fetch(pkUrl(PK_STATE)+':/content',{headers:{Authorization:'Bearer '+tok}});if(r.status===404)return{jobs:{}};if(!r.ok)throw new Error('sync record '+r.status);const d=await r.json();return d&&d.jobs?d:{jobs:{}};}
async function pkStateSave(tok,job,rec){ // read-merge-write so two admins never erase each other's record
  for(let a=0;a<3;a++){
    const H={Authorization:'Bearer '+tok};let etag=null,cur={jobs:{}};
    const mr=await fetch(pkUrl(PK_STATE),{headers:H});
    if(mr.status!==404){if(!mr.ok)return;etag=(await mr.json()).eTag;const cr=await fetch(pkUrl(PK_STATE)+':/content',{headers:H});if(!cr.ok)return;const d=await cr.json();if(d&&d.jobs)cur=d;}
    cur.jobs[job]=rec;const PH={Authorization:'Bearer '+tok,'Content-Type':'application/json'};if(etag)PH['If-Match']=etag;
    const pr=await fetch(pkUrl(PK_STATE)+':/content',{method:'PUT',headers:PH,body:JSON.stringify(cur)});
    if(pr.status===412)continue;return;
  }
}
async function pkLoadPacket(tok,j){
  const r=await fetch('https://graph.microsoft.com/v1.0/drives/'+EW_DRIVE+'/items/'+j.file.id+'/content',{headers:{Authorization:'Bearer '+tok}});
  if(!r.ok)throw new Error('packet download '+r.status);
  const wb=XLSX.read(await r.arrayBuffer(),{type:'array'});
  return pkParse(wb,j.job);
}
async function pkWrite(tok,j,parsed){
  const rows=parsed.rows;
  const victims=S.scope.filter(r=>r.JobNum===j.job&&rows.some(n=>n.Phase===r.Phase&&n.ItemType===r.ItemType));
  for(const b of chunk(victims,20))await gBatch(tok,b.map((v,i)=>({id:String(i+1),method:'DELETE',url:`/sites/${FD_SITE}/lists/${S.lists.scope}/items/${v.spId}`,headers:{'If-Match':'*'}})));
  for(const b of chunk(rows,20)){
    const resp=await gBatch(tok,b.map((row,i)=>({id:String(i+1),method:'POST',url:`/sites/${FD_SITE}/lists/${S.lists.scope}/items`,headers:{'Content-Type':'application/json'},body:{fields:packFields('scope',row)}})));
    const bad=resp.filter(r=>r.status>=400);if(bad.length)throw new Error(bad.length+' rows failed (HTTP '+bad[0].status+')');
  }
  await pkStateSave(tok,j.job,{file:j.file.name,modified:j.file.modified,syncedAt:new Date().toISOString(),by:(auth.user&&auth.user.name)||'',rows:rows.length});
  // earthwork setup: fill it in from the packet only if nobody has set this job up by hand
  try{
    const e=parsed.earth||{};
    if(e.bidCY||e.bidSY){
      const H={Authorization:'Bearer '+tok};let etag=null,cur={rates:{},eqMap:{},jobs:{}};
      const mr=await fetch(ewUrl(),{headers:H});
      if(mr.status!==404&&mr.ok){etag=(await mr.json()).eTag;const cr=await fetch(ewUrl()+':/content',{headers:H});if(cr.ok){const d=await cr.json();if(d&&typeof d==='object')cur=Object.assign(cur,d);}}
      cur.jobs=cur.jobs||{};
      if(!cur.jobs[j.job]){
        cur.jobs[j.job]={name:j.name,bidCY:e.bidCY||0,bidCost:e.bidCost||0,bidSY:e.bidSY||0,bidCostFG:e.bidCostFG||0,rates:e.rates||{},fromPacket:true};
        const PH={Authorization:'Bearer '+tok,'Content-Type':'application/json'};if(etag)PH['If-Match']=etag;
        await fetch(ewUrl()+':/content',{method:'PUT',headers:PH,body:JSON.stringify(cur)});
        if(S.earth)S.earth.setup=cur;
      }
    }
  }catch(e){console.warn('earth setup from packet',e);}
}
// Runs by itself for admins: finds new jobs and imports any job that has a packet but no scope yet.
async function pkAuto(force){
  if(!auth.isAdmin||S.pkBusy||!S.lists||typeof XLSX==='undefined')return;
  if(!force){const last=+sessionStorage.getItem('vhtrk_pk_scan')||0;if(Date.now()-last<10*60000&&S.pk)return;}
  S.pkBusy=true;
  try{
    const tok=await getToken();if(!tok)return;
    const [jobs,state]=await Promise.all([pkScan(tok),pkState(tok)]);
    sessionStorage.setItem('vhtrk_pk_scan',String(Date.now()));
    const have={};S.scope.forEach(r=>{have[r.JobNum]=(have[r.JobNum]||0)+1;});
    const imported=[],failed=[];
    for(const j of jobs){
      const rec=state.jobs[j.job];
      j.rows=have[j.job]||0;
      if(!j.file){j.status='nopacket';continue;}
      if(!j.rows){
        if(rec&&rec.modified===j.file.modified&&rec.rows===0){j.status='empty';continue;} // already tried this exact file: nothing usable in it
        try{
          const parsed=await pkLoadPacket(tok,j);
          if(!parsed.rows.length){await pkStateSave(tok,j.job,{file:j.file.name,modified:j.file.modified,syncedAt:new Date().toISOString(),rows:0});j.status='empty';continue;}
          await pkWrite(tok,j,parsed);imported.push(j.job);j.status='synced';j.rows=parsed.rows.length;
        }catch(e){console.warn('packet sync',j.job,e);failed.push(j.job);j.status='error';j.err=e.message;}
      }else if(!rec)j.status='manual';                       // scope was loaded by hand before packet sync existed
      else if(rec.modified!==j.file.modified)j.status='changed'; // packet edited since the last sync
      else j.status='synced';
    }
    S.pk={jobs,at:Date.now(),attention:jobs.filter(j=>j.status==='changed'||j.status==='error'||j.status==='empty').length};
    if(imported.length){await loadAll();toast('Scope imported from field packets: '+imported.join(', '));}
    if(failed.length)toast('Packet import failed for '+failed.join(', ')+'. Open Packets for details.','err');
    render();
  }catch(e){console.warn('pkAuto',e);S.pk=S.pk||{jobs:[],err:e.message,attention:0};if(force)toast('Packet scan failed: '+e.message,'err');}
  finally{S.pkBusy=false;}
}
async function pkResync(job){
  const j=((S.pk&&S.pk.jobs)||[]).find(x=>x.job===job);if(!j||!j.file||S.pkBusy)return;
  S.pkBusy=true;toast('Reading '+j.file.name+'…');
  try{
    const tok=await getToken(true);if(!tok)return;
    const parsed=await pkLoadPacket(tok,j);
    if(!parsed.rows.length){toast('No storm, sanitary or lateral takeoff rows found in that packet.','err');return;}
    const newIds={};parsed.rows.forEach(r=>{newIds[r.Phase+'|'+r.ItemType+'|'+nid(r.Title)]=1;});
    const old=S.scope.filter(r=>r.JobNum===job&&parsed.rows.some(n=>n.Phase===r.Phase&&n.ItemType===r.ItemType));
    const gone=old.filter(r=>!newIds[r.Phase+'|'+r.ItemType+'|'+nid(r.ItemID)]);
    const lost=gone.filter(r=>pctOf(job,r.ItemID)>0);
    const tot=pkTotals(parsed.rows).map(x=>`${PHASE_LABELS[x.phase]||x.phase} ${x.type}s: ${x.n} items, ${fmt0(x.lf)} LF, ${fmt(x.hrs)} bid hrs`).join('\n');
    const msg=`Re-sync job ${job} from "${j.file.name}"?\n\n${tot}\n\n`+
      (old.length?`${old.length} existing rows will be replaced. ${gone.length} of them are not in the packet under the same ID`+(lost.length?`, and ${lost.length} of those have progress recorded that will no longer show (${lost.slice(0,6).map(r=>r.ItemID).join(', ')}${lost.length>6?'…':''}).`:'.'):'No existing rows are affected.');
    if(!confirm(msg))return;
    await pkWrite(tok,j,parsed);await loadAll();S.pk=null;sessionStorage.removeItem('vhtrk_pk_scan');
    toast(parsed.rows.length+' scope rows loaded for '+job);pkAuto(true);
  }catch(e){toast('Re-sync failed: '+e.message,'err');}
  finally{S.pkBusy=false;render();}
}

  const lab={synced:['In sync','var(--green,#16a34a)'],changed:['Packet changed since last sync','var(--red)'],manual:['Loaded by hand, never synced from packet','#d97706'],
    nopacket:['No field packet in the folder','#d97706'],empty:['Packet has no takeoff rows the tracker can read','var(--red)'],error:['Import failed','var(--red)']};

    <p class="note">Every job folder under Field\\Jobs\\{year} is checked for a field packet. A job with no scope yet is imported automatically. A job that already has scope is only replaced when you press Re-sync.</p>
    <button class="btn btn-sm" onclick="S.pk=null;sessionStorage.removeItem('vhtrk_pk_scan');render()"><i class="ti ti-refresh"></i> Scan again</button></div>`;

      <span class="note">${j.file?esc(j.file.name)+' \u00b7 edited '+String(j.file.modified).slice(0,10):'no packet file'} \u00b7 ${j.rows} scope rows</span><br>
      <span style="font-size:12.5px;color:${L[1]}">${L[0]}${j.err?': '+esc(j.err):''}</span></div>
      ${j.file?`<button class="btn btn-sm" onclick="pkResync('${esc(j.job)}')"><i class="ti ti-refresh-dot"></i> ${j.rows?'Re-sync':'Import'}</button>`:''}</div>`;});
  if(!(S.pk.jobs||[]).length&&!S.pk.err)h+=`<div class="sec"><div class="empty">No job folders found under Field\\Jobs.</div></div>`;
  return h;
}
// ===== EARTHWORK YARDAGE & COST ==============================================
// Mirrors the field packet's "Dirt Job Cost Tracker", but nobody types the daily lines:
//   yardage  = the foreman's daily production report (phase 300 = CY, 310 = SY)
//   cost     = timesheet hours x the job's rate sheet. Machine rates INCLUDE the operator, so hours
//              on a machine are charged at the machine rate only; only hours NOT on a machine are
//              charged at the person's labor rate.
const EW_DRIVE='b!bx9kGOaza0OourrHa-9_tVTRgr5ON91GmZc4OzbW_xXXtcQafX0iTa2THLVm3FW_';
const EW_FILE='Field/Jobs/earthwork-setup.json';
const EW_MACH=['621 - SCRAPER','613 - PW','TS-14','HAUL TRUCK','D5','D6','D7','D8','TRACKHOE','TRACTOR','ROLLER','LOADER','SKID/BACKHOE','MINI-EXCAVATOR','TRACTOR AND PAN'];
const EW_LAB=['FOREMAN','OPER','LABOR','SUPERVISOR'];
const EW_DEF_RATES={'621 - SCRAPER':227,'613 - PW':238,'TS-14':170,'HAUL TRUCK':224,'D5':117,'D6':206,'D7':232,'D8':195,'TRACKHOE':214,'TRACTOR':170,'ROLLER':216,'LOADER':155,'SKID/BACKHOE':116,'MINI-EXCAVATOR':126,'TRACTOR AND PAN':306.35,'FOREMAN':45,'OPER':41,'LABOR':39.5,'SUPERVISOR':67};
const EW_PH={'300':{label:'Mass earthwork',unit:'CY',q:'bidCY',c:'bidCost'},'310':{label:'Finish grade',unit:'SY',q:'bidSY',c:'bidCostFG'}};
function ewUrl(){return 'https://graph.microsoft.com/v1.0/drives/'+EW_DRIVE+'/root:/'+EW_FILE.split('/').map(encodeURIComponent).join('/');}
function money(n){return (n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();}
function money2(n){return isFinite(n)?'$'+n.toFixed(2):'\u2014';}
async function loadEarth(quiet){
  if(S.earthLoading)return;S.earthLoading=true;
  try{
    const tok=await getToken();if(!tok)return;
    const H={Authorization:'Bearer '+tok};
    const [tj,sr]=await Promise.all([
      vhGetAll(tok,`https://graph.microsoft.com/v1.0/sites/${FD_SITE}/lists/${TSJL_LIST}/items?$expand=fields&$top=999`,'TimesheetJobLines'),
      fetch(ewUrl()+':/content',{headers:H})
    ]);
    let setup={rates:{},eqMap:{},jobs:{}};
    if(sr.ok){try{const d=await sr.json();if(d&&typeof d==='object')setup=Object.assign(setup,d);}catch(e){}}
    else if(sr.status!==404)throw new Error('setup file '+sr.status);
    const rows=tj.map(i=>i.fields).filter(f=>f&&EW_PH[String(f.Phase||'').trim()]);
    S.earth={rows,setup};
  }catch(e){console.warn('loadEarth',e);toast('Earthwork load failed: '+e.message,'err');S.earth={rows:[],setup:{rates:{},eqMap:{},jobs:{}},err:e.message};}
  finally{S.earthLoading=false;if(!quiet)render();}
}
function ewCat(num,desc,setup){
  const k=String(num||'').trim();
  if(setup.eqMap&&setup.eqMap[k])return setup.eqMap[k]==='(ignore)'?'':setup.eqMap[k];
  const s=(k+' '+String(desc||'')).toUpperCase();
  if(/PAN\b/.test(s))return 'TRACTOR AND PAN';
  if(/621/.test(s))return '621 - SCRAPER';
  if(/613/.test(s))return '613 - PW';
  if(/TS-?\s?14/.test(s))return 'TS-14';
  if(/HAUL|ARTIC|OFF.?ROAD|ROCK TRUCK/.test(s))return 'HAUL TRUCK';
  const d=s.match(/\bD-?\s?([5678])/);if(d)return 'D'+d[1];
  if(/MINI/.test(s))return 'MINI-EXCAVATOR';
  if(/EXCAV|TRACK\s?HOE/.test(s))return 'TRACKHOE';
  if(/ROLLER|COMPACT|SHEEPS|PAD\s?FOOT/.test(s))return 'ROLLER';
  if(/SKID|BACKHOE/.test(s))return 'SKID/BACKHOE';
  if(/LOADER/.test(s))return 'LOADER';
  if(/TRACTOR/.test(s))return 'TRACTOR';
  return null; // unknown: needs a category picked in setup
}
function ewClass(title){const s=String(title||'').toUpperCase();if(/SUPER/.test(s))return 'SUPERVISOR';if(/FOREMAN|CREW\s?LEAD/.test(s))return 'FOREMAN';if(/OPER/.test(s))return 'OPER';return 'LABOR';}
function ewRates(job){const st=S.earth.setup;return Object.assign({},EW_DEF_RATES,st.rates||{},((st.jobs||{})[job]||{}).rates||{});}
function ewJobs(){
  const s=new Set(Object.keys(S.earth.setup.jobs||{}));
  S.earth.rows.forEach(f=>{const j=String(f.Jobnumber||'').trim();if(j)s.add(j);});
  S.prod.forEach(f=>{if(EW_PH[String(f.Phase||'').trim()]){const j=String(f.Jobnumber||'').trim();if(j)s.add(j);}});
  return [...s].sort();
}
function ewData(job){
  const st=S.earth.setup,rates=ewRates(job);
  const out={ph:{'300':{days:{},cost:0,qty:0},'310':{days:{},cost:0,qty:0}},equip:{},unmapped:0};
  const day=(ph,dt)=>out.ph[ph].days[dt]||(out.ph[ph].days[dt]={cost:0,qty:0,mach:0,lab:0});
  S.earth.rows.forEach(f=>{
    if(String(f.Jobnumber||'').trim()!==job)return;
    const ph=String(f.Phase||'').trim(),dt=String(f.WorkDate||'').slice(0,10);if(!dt)return;
    const hrs=+f.Hours||0;let eq=[];try{eq=JSON.parse(f.Equipment||'[]')||[];}catch(e){}
    let eqH=0,c=0;
    eq.forEach(x=>{
      const h=parseFloat(x&&x.hours)||0;if(!(h>0))return;
      const num=String(x.number||x.id||'').trim(),cat=ewCat(num,x.description,st);
      const rec=out.equip[num]||(out.equip[num]={desc:x.description||'',cat:cat,hrs:0});rec.hrs+=h;
      eqH+=h;
      if(cat===null){out.unmapped++;}
      else if(cat)c+=h*(rates[cat]||0);
    });
    const labH=Math.max(0,hrs-eqH);
    c+=labH*(rates[ewClass(f.EmployeeTitle)]||0);
    const d=day(ph,dt);d.cost+=c;d.mach+=eqH;d.lab+=labH;out.ph[ph].cost+=c;
  });
  S.prod.forEach(f=>{
    if(String(f.Jobnumber||'').trim()!==job)return;
    const ph=String(f.Phase||'').trim();if(!EW_PH[ph])return;
    const q=parseFloat(String(f['Yardage_x002f_production']||'').replace(/,/g,''));if(!(q>0))return;
    const dt=String(f.Date||f.Created||'').slice(0,10);if(!dt)return;
    day(ph,dt).qty+=q;out.ph[ph].qty+=q;
  });
  return out;
}
function ewSummary(job,ph,d){
  const cfg=(S.earth.setup.jobs||{})[job]||{};const P=EW_PH[ph];
  const bidQ=+cfg[P.q]||0,bidC=+cfg[P.c]||0,cost=d.ph[ph].cost,qty=d.ph[ph].qty;
  const bidU=bidQ?bidC/bidQ:NaN,actU=qty?cost/qty:NaN,left=Math.max(0,bidQ-qty);
  return {bidQ,bidC,cost,qty,bidU,actU,left,pct:bidQ?qty/bidQ*100:0,
    earned:isFinite(bidU)?qty*bidU:NaN,           // what the yards moved so far were bid at
    perLeft:left?(bidC-cost)/left:NaN,            // money left per yard left
    proj:(qty&&bidQ)?cost+left*actU:NaN};         // final cost if the current rate holds
}

  });
  if(auth.isAdmin)h+=`<div class="sec"><span class="note">Set up a job that has no time yet:</span> <input id="ew-new" placeholder="Job #" style="padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:inherit;width:110px"> <button class="btn btn-sm" onclick="const v=document.getElementById('ew-new').value.trim();if(v){S.ejob=v;S.eset=true;render();}">Set up</button></div>`;
  return h;

    h+=`<div class="sec"><h2>${P.label} <span class="h2-sub">phase ${ph}</span></h2>
      <div class="kg">
        <div class="k"><div class="lbl">Bid ${P.unit}</div><div class="val">${s.bidQ?fmt0(s.bidQ):'\u2014'}</div><div class="sub">${money2(s.bidU)} / ${P.unit} bid</div></div>
        <div class="k"><div class="lbl">Actual ${P.unit}</div><div class="val">${fmt0(s.qty)}</div><div class="sub">${fmt0(s.pct)}% \u00b7 ${fmt0(s.left)} left</div></div>
        <div class="k"><div class="lbl">Bid cost</div><div class="val">${s.bidC?money(s.bidC):'\u2014'}</div></div>
        <div class="k"><div class="lbl">Cost to date</div><div class="val">${money(s.cost)}</div><div class="sub">${money2(s.actU)} / ${P.unit} actual</div></div>
        <div class="k"><div class="lbl">Over / under</div><div class="val${v<0?' bad':''}">${isFinite(v)&&s.qty?(v<0?'-':'+')+money(Math.abs(v)).replace('-',''):'\u2014'}</div><div class="sub">vs bid for ${P.unit} moved</div></div>
        <div class="k"><div class="lbl">Projected final</div><div class="val${isFinite(s.proj)&&s.proj>s.bidC?' bad':''}">${isFinite(s.proj)?money(s.proj):'\u2014'}</div><div class="sub">${money2(s.perLeft)} / ${P.unit} left in budget</div></div>
      </div>`;
    if(days.length){
      h+=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px"><tr style="text-align:right;color:var(--text3);font-size:11px"><th style="text-align:left;padding:5px 6px">Date</th><th style="padding:5px 6px">${P.unit}</th><th style="padding:5px 6px">Machine h</th><th style="padding:5px 6px">Labor h</th><th style="padding:5px 6px">Cost</th><th style="padding:5px 6px">$ / ${P.unit}</th></tr>`;
      days.slice().reverse().forEach(dt=>{const x=d.ph[ph].days[dt];const u=x.qty?x.cost/x.qty:NaN;
        const flag=x.cost>0&&!x.qty?'cost with no '+P.unit+' reported':(x.qty>0&&!x.cost?P.unit+' with no time':'');
        h+=`<tr style="text-align:right;border-top:1px solid var(--border)"><td style="text-align:left;padding:5px 6px">${dt}${flag?` <span style="color:var(--red);font-size:11px">${flag}</span>`:''}</td><td class="num" style="padding:5px 6px">${x.qty?fmt0(x.qty):'\u2014'}</td><td class="num" style="padding:5px 6px">${fmt(x.mach)}</td><td class="num" style="padding:5px 6px">${fmt(x.lab)}</td><td class="num" style="padding:5px 6px">${money(x.cost)}</td><td class="num" style="padding:5px 6px;color:${isFinite(u)&&isFinite(s.bidU)&&u>s.bidU?'var(--red)':'inherit'}">${money2(u)}</td></tr>`;});
      h+=`</table></div>`;
    }else h+=`<p class="note">No time or production reported yet.</p>`;
    h+=`</div>`;
  });
  if(!cfg.bidCY&&!cfg.bidSY&&!S.eset)h+=`<div class="sec"><p class="note">This job has no bid numbers yet.${auth.isAdmin?' Open <b>Setup</b> and enter the bid yards and bid cost from the field packet.':''}</p></div>`;
  return h;
}
function ewSetupForm(job,d){
  const st=S.earth.setup,cfg=(st.jobs||{})[job]||{},rates=ewRates(job);
  const inp='padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:inherit;width:100%;box-sizing:border-box;font-size:14px';
  const f=(id,label,val)=>`<div><div class="note">${label}</div><input id="${id}" value="${esc(val==null?'':val)}" style="${inp}"></div>`;
  let h=`<div class="sec"><h2>Setup <span class="h2-sub">from this job's field packet</span></h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
    ${f('ew-name','Job name',cfg.name)}${f('ew-bidCY','Mass: bid CY',cfg.bidCY)}${f('ew-bidCost','Mass: bid cost $',cfg.bidCost)}${f('ew-bidSY','Finish: bid SY',cfg.bidSY)}${f('ew-bidCostFG','Finish: bid cost $',cfg.bidCostFG)}</div>
    <div class="note" style="margin:12px 0 4px"><b>Rate sheet, $ per hour.</b> Machine rates include the operator.</div>

    ${EW_MACH.concat(EW_LAB).map((c,i)=>`<div><div class="note">${esc(c)}</div><input class="ew-rate" data-c="${esc(c)}" value="${rates[c]==null?'':rates[c]}" inputmode="decimal" style="${inp}"></div>`).join('')}</div>`;
  const eqs=Object.entries(d.equip);
